# Services of the system (decision A9, D-027): Postgres, MLflow since F3 (D-079), the
# Prefect server and the worker of the monthly flow since F4 (D-099, D-103), and the
# simulated clock (D-107), which belongs to the simulated world, and the prediction API
# since F5 (D-008, D-110). Grafana enters in F6 with the step that uses it and its tests.
# Credentials come from .env (git-ignored); see .env.example.

name: credit-risk

services:
  postgres:
    # Same major version as AWS RDS (step 7.2). Pinned by version and digest.
    image: postgres:18.7-trixie@sha256:eb63372c1e05c755f55fa30cbd07aecc443676fc6c0fa90b9002d01537841e1a
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      # Published only on this machine's loopback interface, never on the network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Since Postgres 18 the image keeps its data in /var/lib/postgresql/18/docker, so the
      # volume is mounted on the parent directory. Mounting the old path
      # (/var/lib/postgresql/data) would leave the data inside the container (E-009).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    restart: unless-stopped

  mlflow:
    # MLflow tracking server and model registry (D-079), run from our own train image so
    # that server and client share the MLflow version of uv.lock (D-091). `make build`
    # builds the image first; compose builds it only if it is missing.
    image: ${TRAIN_IMAGE:-credit-risk:train}
    build:
      context: .
      target: train
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # Metadata go to the database "mlflow" of the same Postgres, created if missing;
    # artefacts go to the volume below through the server (an S3 bucket in AWS).
    command: ["python", "-m", "credit_risk.tracking", "server"]
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5000}:5000"
    volumes:
      - mlartifacts:/mlflow/artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 10s
    restart: unless-stopped

  prefect:
    # Prefect server (API and web interface) of the monthly flow (D-099). Like MLflow it
    # runs from our train image, so server and flow share the Prefect version of uv.lock
    # (D-103); its metadata go to the database "prefect" of the same Postgres.
    image: ${TRAIN_IMAGE:-credit-risk:train}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"
    command: ["python", "-m", "credit_risk.flows", "server"]
    ports:
      - "127.0.0.1:${PREFECT_PORT:-4200}:4200"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')"]
      interval: 3s
      timeout: 5s
      retries: 60
      start_period: 15s
    restart: unless-stopped

  worker:
    # Serves the deployment monthly/monthly: runs what the Prefect server sends it, with
    # the code of the train image (D-103). It only coordinates; the work is in src/.
    image: ${TRAIN_IMAGE:-credit-risk:train}
    depends_on:
      prefect:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PREFECT_API_URL: http://prefect:4200/api
      MLFLOW_TRACKING_URI: http://mlflow:5000
      # After a promotion the flow tells the API to load the new champions (D-111).
      API_URL: http://api:8000
      API_ADMIN_KEY: ${API_ADMIN_KEY:?set API_ADMIN_KEY in .env}
    command: ["python", "-m", "credit_risk.flows", "serve"]
    volumes:
      # Deliveries, validation reports and training sets (S3 in AWS). The deliveries are
      # written by the clock, the simulated provider (D-043, D-105).
      - flowdata:/app/data
    restart: unless-stopped

  clock:
    # The simulated world (D-107): serves advance/advance (schedule paused) and
    # replay/replay. Each advance publishes the next month, lets the simulated investor
    # send it to the API and buy (D-123), and runs the system's flow.
    image: ${TRAIN_IMAGE:-credit-risk:train}
    depends_on:
      prefect:
        condition: service_healthy
      mlflow:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PREFECT_API_URL: http://prefect:4200/api
      MLFLOW_TRACKING_URI: http://mlflow:5000
      # The investor is a client of the API, with a predict key (D-118, D-124).
      API_URL: http://api:8000
      API_PREDICT_KEY: ${API_PREDICT_KEY:?set API_PREDICT_KEY in .env}
    command: ["python", "-m", "credit_risk.simulator.clock", "serve"]
    volumes:
      # The source file, read only: only the simulated world opens it (D-043).
      - ./data/raw:/app/data/raw:ro
      - flowdata:/app/data
    restart: unless-stopped

  api:
    # The prediction API, the single prediction path (D-008), from the light serve image
    # (D-078). It loads the champions from the MLflow registry (D-110) and writes every
    # prediction to serving.predictions before answering (D-121). One process: the
    # reload notice must reach the process that serves (D-111); it scales by containers.
    image: ${SERVE_IMAGE:-credit-risk:serve}
    build:
      context: .
      target: serve
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      API_KEYS_PREDICT: ${API_KEYS_PREDICT:?set API_KEYS_PREDICT in .env}
      API_KEYS_ADMIN: ${API_KEYS_ADMIN:?set API_KEYS_ADMIN in .env}
      API_RELOAD_SECONDS: ${API_RELOAD_SECONDS:-60}
    command: ["python", "-m", "credit_risk.api"]
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      # Liveness only: a system with no champion yet is alive but not ready (/health).
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 5s
    restart: unless-stopped

volumes:
  pgdata:
  mlartifacts:
  flowdata:
