# Scheduled security scans (decision A11, D-029). New vulnerabilities are published
# without any change in our code, so these run every Monday whatever happens.
# pip-audit also runs on every pull request that changes uv.lock.
# A failed scheduled run makes GitHub e-mail the repository owner.

name: Security

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  pull_request:
    paths: [uv.lock]
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: "0.13.9"

jobs:
  dependencies:
    name: dependencies (pip-audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: make audit

  image:
    name: image (Trivy)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          tags: credit-risk:scan
          load: true
          cache-from: type=gha,scope=runtime
      # Fails on HIGH or CRITICAL findings, except the ones listed in .trivyignore.yaml,
      # each with its reason and expiry date.
      - name: Trivy
        run: >
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          -v "$PWD/.trivyignore.yaml:/work/.trivyignore.yaml:ro"
          aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
          image --severity HIGH,CRITICAL --exit-code 1
          --ignorefile /work/.trivyignore.yaml credit-risk:scan
