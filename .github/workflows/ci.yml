# Continuous integration (decision A10, D-028). Runs on every pull request and on every
# push to main. Four jobs in parallel; all four are required checks for merging into main
# (branch protection, decision A14). Target: under 5 minutes.
# Continuous delivery (step 5.2, D-130 to D-136): on main and on release tags vX.Y.Z, a
# fifth job publishes the images the four jobs tested, once they all pass.
# Actions are pinned by commit hash with the version in a comment (decision A12);
# Dependabot updates both.

name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# Least privilege: read the repository and nothing else (decision A12).
permissions:
  contents: read

# A new push to the same PR cancels the run that is still going. On main and on tags runs
# wait their turn instead: a cancelled publication could leave "main" moved on one image
# and not on the other.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.13.9"
  FORCE_COLOR: "1"

jobs:
  quality:
    # The ruleset on main requires this job by its name: rename both or neither (E-025).
    name: quality (lint, format, types, lock)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: make lint

  tests:
    # The ruleset on main requires this job by its name: rename both or neither (E-025).
    name: tests (unit + coverage)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: make test
      # Unit tests alone are shown here; the minimum (D-064) is checked in the integration
      # job, over unit + integration tests together.
      - name: Coverage summary (unit tests only)
        if: always()
        run: |
          {
            echo '### Coverage of the unit tests (branch)'
            echo '```'
            uv run --frozen coverage report --fail-under=0
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  secrets:
    # The ruleset on main requires this job by its name: rename both or neither (E-025).
    name: secrets (gitleaks, full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        run: >
          docker run --rm -v "$PWD:/repo" -w /repo
          zricethezav/gitleaks:v8.30.0@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9
          git --redact --verbose /repo

  integration:
    # The ruleset on main requires this job by its name: rename both or neither (E-025).
    name: integration (image + Postgres)
    runs-on: ubuntu-24.04
    # Training and promotion tests (F3) added a few minutes; the smoke test and the
    # rehearsal of the publication (F5, T22.3 and T22.4) about 4 more (E-052).
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # diff-cover compares with origin/main (D-064)
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The two application images of D-078. Compose runs the MLflow server from train.
      - name: Build the serve image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: serve
          tags: credit-risk:serve
          load: true
          cache-from: type=gha,scope=serve
          cache-to: type=gha,scope=serve,mode=max
      - name: Build the train image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: train
          tags: credit-risk:train
          build-args: CREDIT_RISK_COMMIT=${{ github.sha }}
          load: true
          cache-from: type=gha,scope=train
          cache-to: type=gha,scope=train,mode=max
      - name: Build the test image (package installed as in production)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: test
          tags: credit-risk:test
          load: true
          cache-from: type=gha,scope=test
          cache-to: type=gha,scope=test,mode=max
      - name: Unit tests inside the image
        run: docker run --rm credit-risk:test
      - run: uv sync --frozen
      # CI uses the development values of .env.example; nothing secret.
      - run: cp .env.example .env
      # Unit + integration tests with coverage: at least 85% of branches (D-064).
      - run: make test-integration
      # At least 90% of the lines this change adds or modifies are covered (D-064).
      - run: make diff-cover
      - name: Coverage summary (unit + integration)
        if: always()
        run: |
          {
            echo '### Coverage of unit + integration tests (branch)'
            echo '```'
            uv run --frozen coverage report --fail-under=0 || true
            echo '```'
            echo '### Changed lines'
            echo '```'
            uv run --frozen diff-cover coverage.xml --compare-branch=origin/main || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # The images just tested travel to the publish job as they are: built once (D-133).
      - name: Keep the tested images for the publish job
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          printf '{"serve": "%s", "train": "%s"}\n' \
            "$(docker image inspect --format '{{.Id}}' credit-risk:serve)" \
            "$(docker image inspect --format '{{.Id}}' credit-risk:train)" > tested.json
          docker save credit-risk:serve credit-risk:train | gzip -1 > images.tar.gz
      - name: Upload the tested images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-images
          path: |
            images.tar.gz
            tested.json
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - name: Postgres logs on failure
        if: failure()
        run: docker compose logs postgres
      - if: always()
        run: docker compose down -v

  publish:
    # Continuous delivery (step 5.2): only on main and on release tags, never on a pull
    # request, and only once the four jobs pass (D-133). See ci/publish.py for the steps.
    name: publish (GHCR)
    needs: [quality, tests, secrets, integration]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The only job that writes: packages, with the token of this run (no stored secret, D-130).
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      # The smoke test registers made-up champions with the project's own code.
      - run: uv sync --frozen
      - name: Log in to GHCR
        run: echo "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
      - name: Download the images the integration job tested
        if: github.ref == 'refs/heads/main'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-images
      - name: Load the images the integration job tested
        if: github.ref == 'refs/heads/main'
        run: gunzip -c images.tar.gz | docker load
      # A release builds nothing: it takes what its commit published from main (D-133).
      - name: Pull the images the commit published from main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          for image in serve train; do
            published="ghcr.io/$owner/credit-risk-$image:sha-${GITHUB_SHA::7}"
            docker pull "$published" || {
              echo "::error::$published does not exist: merge the commit to main first"
              exit 1
            }
            docker tag "$published" "credit-risk:$image"
          done
      # A HIGH or CRITICAL finding not listed in .trivyignore.yaml publishes nothing (D-135).
      - name: Trivy
        run: |
          for image in serve train; do
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$PWD/.trivyignore.yaml:/work/.trivyignore.yaml:ro" \
              aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb \
              image --severity HIGH,CRITICAL --exit-code 1 \
              --ignorefile /work/.trivyignore.yaml "credit-risk:$image"
          done
      # Push the commit tag, pull back by digest, smoke test, then move main or add the
      # version (D-132, D-134). Rehearsed on every pull request against a local registry
      # (T22.4).
      - name: Publish
        run: |
          tested=()
          if [ -f tested.json ]; then tested=(--tested tested.json); fi
          uv run --frozen python -m ci.publish --ref "$GITHUB_REF" --sha "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" "${tested[@]}" --fresh-pull
