# Dependabot (decision A11, D-029): opens a weekly pull request when new versions exist.
# Minor and patch updates are grouped into one PR per ecosystem; major updates come one
# by one, because they can change behaviour. Every PR runs the full CI before review.
# If an update touches the pinned versions of the audit notebook (group "notebooks"),
# the notebook is re-run and its numbers compared (decision A6).

version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      docker-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    ignore:
      # The Postgres major version follows AWS RDS (decision A9) and is changed on purpose.
      - dependency-name: postgres
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
