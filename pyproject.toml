[project]
name = "credit-risk"
version = "0.1.0"
description = "Production system (MLOps) for a Lending Club credit risk model: PD, LGD and expected loss."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Juan Garrido García" }]
dependencies = [
    "fastapi>=0.150",
    "lightgbm>=4.7",
    "mlflow-skinny>=3.18",
    "pandera[polars]>=0.36",
    "polars>=2.1",
    "psycopg[binary,pool]>=3.3.9",
    "pydantic-settings>=2.16",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.54",
]

[project.scripts]
credit-risk = "credit_risk.__main__:main"

[dependency-groups]
dev = [
    "diff-cover>=11.0",
    "httpx>=0.28",
    "mypy>=2.4",
    "pip-audit>=2.9",
    "pre-commit>=4.7",
    "pytest>=9.2",
    "pytest-cov>=7.1",
    # T22.2 reads the workflows (already in uv.lock through MLflow and Prefect).
    "pyyaml>=6.0",
    "ruff>=0.17",
]
# Exact versions used by notebooks/00_data_audit.ipynb in F0 (decision A6 / D-024).
# On a conflict: upgrade, re-run the audit and check the numbers do not change.
notebooks = [
    "ipykernel==7.4.0",
    "jupyter==1.1.1",
    "kaggle==2.2.5",
    "matplotlib==3.11.2",
    "nbconvert==7.17.2",
    "numpy==2.5.5",
    "pandas==3.1.1",
    "polars==2.1.0",
    "pyarrow==26.0.1",
    "scikit-learn==1.9.1",
]
train = [
    "mlflow>=3.18",
    "optuna>=5.1",
    "prefect>=3.9.4",
    "shap>=0.54",
]

[tool.uv]
default-groups = ["dev", "train"]

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "credit_risk"

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "ci"]
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "C4",       # comprehensions
    "PT",       # pytest style
    "RUF",      # ruff-specific
    "S",        # bandit (security)
    "N",        # naming
    "BLE",      # blind except
    "PTH",      # use pathlib
    "TID",      # tidy imports
]

[tool.ruff.lint.per-file-ignores]
# assert is the point of a test; fake credentials are expected in tests;
# subprocess calls to docker are expected in integration tests.
"tests/**" = ["S101", "S105", "S603", "S607"]
# Notebooks are exploratory (see A3): allow prints, asserts and long lines.
"notebooks/**" = ["S101", "S603", "S607", "E501", "T201", "B018", "N806"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
files = ["src", "tests", "ci"]
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
# Tests are checked, but annotations are not required everywhere (decision A4).
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
# Libraries without type information (F3).
module = ["sklearn.*", "lightgbm.*", "scipy.*", "optuna.*", "mlflow.*", "joblib.*", "shap.*", "yaml.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "integration: needs Docker (Postgres via docker compose, or the built image)",
    "destructive: recreates containers; runs last and on its own",
    "data: needs the real Lending Club file in data/raw (not in CI)",
]
xfail_strict = true
filterwarnings = [
    "error",
    # E-043: Starlette 1.10 asks for its new httpx2 client in TestClient; httpx (already in
    # uv.lock through Prefect) still works. Revisit when the lock moves to httpx2.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
# ci: the delivery tooling (step 5.2), outside the package and every image.
source = ["credit_risk", "ci"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
# D-064: at least 85% of branches over unit + integration tests (checked by
# `make test-integration`), and 90% of the lines each pull request changes (`make diff-cover`).
fail_under = 85
exclude_also = ['if __name__ == "__main__":']
