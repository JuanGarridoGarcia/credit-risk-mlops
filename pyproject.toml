[project]
name = "credit-risk"
version = "0.1.0"
description = "Production system (MLOps) for a Lending Club credit risk model: PD, LGD and expected loss."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Juan Garrido García" }]
dependencies = [
    "psycopg[binary]>=3.3",
    "pydantic-settings>=2.16",
]

[project.scripts]
credit-risk = "credit_risk.__main__:main"

[dependency-groups]
dev = [
    "mypy>=2.4",
    "pip-audit>=2.9",
    "pre-commit>=4.7",
    "pytest>=9.2",
    "pytest-cov>=7.1",
    "ruff>=0.17",
]
# Exact versions used by notebooks/00_data_audit.ipynb in F0 (decision A6 / D-024).
# On a conflict: upgrade, re-run the audit and check the numbers do not change.
notebooks = [
    "ipykernel==7.4.0",
    "jupyter==1.1.1",
    "kaggle==2.2.5",
    "matplotlib==3.11.2",
    "nbconvert==7.17.2",
    "numpy==2.5.5",
    "pandas==3.1.1",
    "polars==2.1.0",
    "pyarrow==26.0.1",
    "scikit-learn==1.9.1",
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "credit_risk"

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "C4",       # comprehensions
    "PT",       # pytest style
    "RUF",      # ruff-specific
    "S",        # bandit (security)
    "N",        # naming
    "BLE",      # blind except
    "PTH",      # use pathlib
    "TID",      # tidy imports
]

[tool.ruff.lint.per-file-ignores]
# assert is the point of a test; fake credentials are expected in tests;
# subprocess calls to docker are expected in integration tests.
"tests/**" = ["S101", "S105", "S603", "S607"]
# Notebooks are exploratory (see A3): allow prints, asserts and long lines.
"notebooks/**" = ["S101", "S603", "S607", "E501", "T201", "B018", "N806"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
# Tests are checked, but annotations are not required everywhere (decision A4).
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pydantic-mypy]
init_forbid_extra = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "integration: needs Docker (Postgres via docker compose, or the built image)",
    "destructive: recreates containers; runs last and on its own",
]
xfail_strict = true
filterwarnings = ["error"]

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
source = ["credit_risk"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
# No fail_under until F2 (decision A13).
